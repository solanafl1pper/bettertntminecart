plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7-SNAPSHOT'
}

group = 'solana.flipper'
version = '1.0.1'

base {
    archivesName = 'bettertntminecart-forge-1.16.5'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
    }
}

minecraft {
    mappings channel: 'official', version: '1.16.5'
    copyIdeResources = true
}

mixin {
    add sourceSets.main, "bettertntminecart.refmap.json"
    config "bettertntminecart.mixins.json"
}

repositories {
    maven { url = 'https://maven.minecraftforge.net/' }
    maven { url = 'https://maven.shedaniel.me/' }
    mavenCentral()
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.16.5-36.2.39'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    implementation fg.deobf("me.shedaniel.cloth:cloth-config-forge:4.17.132")
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            "Specification-Title"     : "bettertntminecart",
            "Specification-Vendor"    : "solanafl1pper",
            "Specification-Version"   : "1",
            "Implementation-Title"    : project.name,
            "Implementation-Version"  : project.jar.archiveVersion,
            "Implementation-Vendor"   : "solanafl1pper",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
            "MixinConfigs"            : "bettertntminecart.mixins.json"
        ])
    }
}
